<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop Order Management System - Manage vendor orders efficiently">
    <meta name="theme-color" content="#4CAF50">
    <title>Shop Order Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <h1>Shop Orders</h1>
        <div class="top-bar-actions">
            <input type="text" id="searchInput" placeholder="Search items..." class="search-input">
            <button id="saveSessionBtn" class="btn btn-secondary" title="Ctrl+S">Save Session</button>
            <button id="loadSessionBtn" class="btn btn-secondary">Load Previous</button>
            <button id="newSessionBtn" class="btn btn-danger">New Session</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Left Panel - Quick Entry -->
        <aside class="entry-panel">
            <!-- Frequent Items -->
            <section class="frequent-items">
                <h2>Frequent Items</h2>
                <div id="frequentItemsGrid" class="frequent-grid">
                    <p class="empty-message">Add items to see frequent picks</p>
                </div>
            </section>

            <!-- Entry Form -->
            <section class="entry-form">
                <h2>Add Item</h2>
                <form id="itemForm">
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input
                            type="text"
                            id="itemName"
                            list="itemSuggestions"
                            placeholder="e.g., Rice Bags"
                            required
                            autocomplete="off"
                        >
                        <datalist id="itemSuggestions"></datalist>
                    </div>

                    <div class="form-group">
                        <label for="vendorSelect">Vendor</label>
                        <input
                            type="text"
                            id="vendorSelect"
                            list="vendorSuggestions"
                            placeholder="e.g., Vendor A"
                            required
                            autocomplete="off"
                        >
                        <datalist id="vendorSuggestions"></datalist>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <div class="quantity-input">
                            <button type="button" id="decrementBtn" class="qty-btn">−</button>
                            <input
                                type="number"
                                id="quantity"
                                value="1"
                                min="1"
                                inputmode="numeric"
                            >
                            <button type="button" id="incrementBtn" class="qty-btn">+</button>
                        </div>
                    </div>

                    <button type="submit" id="addItemBtn" class="btn btn-primary btn-large">
                        Add Item
                    </button>
                </form>
            </section>
        </aside>

        <!-- Right Panel - Vendor Cards -->
        <section class="vendor-section">
            <div id="vendorCardsContainer" class="vendor-cards">
                <p class="empty-message">Add your first item to get started</p>
            </div>
        </section>
    </main>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Load Session Modal -->
    <div id="loadSessionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Load Previous Session</h2>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="sessionsList">
                <p class="empty-message">No saved sessions found</p>
            </div>
        </div>
    </div>

    <!-- Confirmation Dialog -->
    <div id="confirmDialog" class="modal">
        <div class="modal-content confirm-dialog">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm Action</h2>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button id="confirmCancelBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmOkBtn" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
